name: Grattoir Pharmacies de Garde Ouaga
on:
  schedule:
    - cron: '5 0 * * *'   # 00h05 UTC — 1ère tentative
    - cron: '0 2 * * *'   # 02h00 UTC — 2ème tentative
    - cron: '0 4 * * *'   # 04h00 UTC — 3ème tentative
    - cron: '0 6 * * *'   # 06h00 UTC — 4ème tentative (filet de sécurité)
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installateur Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 lxml
      - name: Lancer le scraper
        run: python scraper.py
      - name: Vérifier le fichier généré
        run: |
          echo "=== Contenu de pharmacies_garde_ouaga.json ==="
          cat pharmacies_garde_ouaga.json
          echo ""
          echo "=== Nombre de pharmacies ==="
          python3 -c "import json; data=json.load(open('pharmacies_garde_ouaga.json')); print(f'{len(data)} pharmacie(s) trouvée(s)')"
      - name: Sauvegarder sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pharmacies_garde_ouaga.json
          if git diff --staged --quiet; then
            echo "Aucun changement détecté dans le fichier. Pas de commit."
          else
            git commit -m "🏥 Garde du $(date +'%Y-%m-%d') mise à jour"
            git push
            echo "✅ Fichier poussé sur GitHub avec succès"
          fi
